# Builds the plugin for Windows (x64) first, then macOS as a universal
# (arm64 + x86_64) binary, merges both into the single cross-platform
# .bundle, codesigns + notarizes the mac binary, and publishes a GitHub
# Release with the zip and dmg attached.
#
# NOTE: /test/ path is intentional and static for this project.
# Run manually on the selected immutable commit; source metadata determines
# the version and create-only publication. No tag or version inputs.
# Canonical layout enforced:
#   test/Plugins/<Product>.bundle/Contents/MacOS/<Product>
#   test/Plugins/<Product>.bundle/Contents/Windows64/<Product>.4DX

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- only this needs editing per-project ----
  PRODUCT_NAME: OCR
  MACOS_DEPLOYMENT_TARGET: '11.0'
  # static base for this project (intentional)
  BASE_DIR: test
  # ---------------------------------------------

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: validate source and publication availability
        id: set
        env:
          SELECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$SELECTED_SHA"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: clean stale outputs
        shell: pwsh
        run: |
          $product = "${{ env.PRODUCT_NAME }}"
          $base = "${{ env.BASE_DIR }}"
          $ErrorActionPreference = 'Stop'
          # Windows paths are case-insensitive: deleting plugins deletes Plugins
          # and its committed resources too. Invalidate only Release|x64 output.
          $output = "$base/plugins/$product.bundle/contents/windows64/$product.4DX"
          if (Test-Path -LiteralPath $output) {
            Remove-Item -LiteralPath $output -Force -ErrorAction Stop
          }

      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: normalize windows output to canonical case
        shell: pwsh
        run: |
          $product = "${{ env.PRODUCT_NAME }}"
          $base = "${{ env.BASE_DIR }}"
          $ErrorActionPreference = 'Stop'
          $canonicalDir = "$base/Plugins/$product.bundle/Contents/Windows64"
          New-Item -ItemType Directory -Force -Path $canonicalDir | Out-Null

          # Exact Release|x64 OutDir from OCR.vcxproj, never a recursive first match.
          $source = "$base/plugins/$product.bundle/contents/windows64/$product.4DX"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Windows binary missing at exact MSBuild output: $source"
          }
          if ((Get-Item -LiteralPath $source).Length -eq 0) {
            throw "Windows binary empty at exact MSBuild output: $source"
          }

          $destination = Join-Path $canonicalDir "$product.4DX"
          $sourceResolved = (Resolve-Path -LiteralPath $source).Path
          $destResolved = (Resolve-Path $destination -ErrorAction SilentlyContinue).Path

          if ($destResolved -and ($sourceResolved -ieq $destResolved)) {
            # Windows is case-insensitive: MSBuild's OutDir (lowercase, per
            # the .vcxproj) and this step's canonical path already point at
            # the identical physical file. Copy-Item correctly refuses to
            # "overwrite" a file with itself - there's nothing left to do.
            Write-Host "Already at canonical location (case-insensitive match) - skipping copy."
          } else {
            Copy-Item -LiteralPath $source $destination -Force
          }
          Get-ChildItem $canonicalDir

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.BASE_DIR }}/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.BASE_DIR }}"
          XCODE_PROJECT="${PRODUCT}.xcodeproj"
          XCODE_TARGET="${PRODUCT}"
          PLUGINS_DIR="${BASE}/Plugins"
          BUNDLE="${PLUGINS_DIR}/${PRODUCT}.bundle"

          # Preserve unrelated committed resources and Windows binaries. On the
          # runner plugins/ and Plugins/ can be the same directory. Invalidate
          # the executable and source-derived metadata so a misdirected build
          # cannot ship stale committed versions.
          rm -f "${BUNDLE:?}/Contents/MacOS/${PRODUCT:?}"
          rm -f "${BUNDLE:?}/Contents/Info.plist"
          rm -f "${BUNDLE:?}/Contents/Resources/English.lproj/InfoPlist.strings"
          rm -rf "${BUNDLE:?}/Contents/_CodeSignature"

          echo "Building $XCODE_PROJECT target $XCODE_TARGET"
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            build

          echo "Built:"
          ls -R "$PLUGINS_DIR"

      - name: verify universal binary
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.BASE_DIR }}"
          BIN="${BASE}/Plugins/${PRODUCT}.bundle/Contents/MacOS/${PRODUCT}"

          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found at $BIN"
            ls -R "$BASE"
            exit 1
          fi

          echo "Timestamp check (must be recent):"
          ls -lT "$BIN" || ls -l --time-style=full "$BIN"

          lipo -info "$BIN"
          ARCHITECTURES=$(lipo -archs "$BIN")
          case "$ARCHITECTURES" in
            "arm64 x86_64"|"x86_64 arm64") ;;
            *)
              echo "::error::Expected exactly arm64 and x86_64 (no i386); got $ARCHITECTURES"
              exit 1
              ;;
          esac
          python3 .github/scripts/source_version.py --verify-bundle "${BASE}/Plugins/${PRODUCT}.bundle"

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.BASE_DIR }}"
          BUNDLE="${BASE}/Plugins/${PRODUCT}.bundle"

          mkdir -p "$BUNDLE/Contents/Windows64"

          echo "winbuild contents:"
          ls -R winbuild || true

          SRC="winbuild/${PRODUCT}.4DX"
          if [ ! -s "$SRC" ]; then
            echo "::error::Windows binary missing at exact artifact path $SRC"
            exit 1
          fi

          echo "Copying $SRC -> $BUNDLE/Contents/Windows64/${PRODUCT}.4DX"
          cp "$SRC" "$BUNDLE/Contents/Windows64/${PRODUCT}.4DX"

          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
          ls -R "$BUNDLE/Contents"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${PRODUCT}-${VERSION}.zip"
          DMG_PATH="${PRODUCT}-${VERSION}.dmg"

          echo "Creating $ZIP_PATH"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          echo "Creating $DMG_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          # notarytool can exit zero with status Invalid; require Accepted too.
          notarize() {
            local OUT ID STATUS
            OUT=$(xcrun notarytool submit "$1" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" \
              --wait --output-format json)
            echo "$OUT"
            ID=$(plutil -extract id raw -o - - <<< "$OUT")
            STATUS=$(plutil -extract status raw -o - - <<< "$OUT")
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization of $1 returned '$STATUS'"
              xcrun notarytool log "$ID" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" || true
              return 1
            fi
          }
          notarize "$ZIP_PATH"
          notarize "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -lh "$ZIP_PATH" "$DMG_PATH"

      - name: create GitHub Release
        env:
          SELECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --sha "$SELECTED_SHA" "$ZIP_PATH" "$DMG_PATH"
